name: swipe-release

# 自建 fork 的发布通道：构建同时包含「滑动推荐」的 Windows 安装包，
# 并把更新源固定为本仓库（electron-updater 只检查这里的 Release）。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_OWNER: ${{ github.repository_owner }}
      GH_REPO: ${{ github.event.repository.name }}
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      # libmedia 的 Wasm 资源在部分网络不可达，改用 jsDelivr。
      SOFTWARE_ASSETS_TEMPLATE: https://fastly.jsdelivr.net/gh/zhaohappy/libmedia@{commit}/dist/{name}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify swipe anchors
        run: npm run check:swipe

      - name: Unit tests
        run: npm run test:swipe

      - name: Fetch bundled media tools
        run: node scripts/setup-ffmpeg.js

      - name: Build React
        run: npm run build:react

      # 只做构建校验并上传 Artifacts；正式 Release 由本地完整打包后 gh release upload，
      # 避免 CI 缺少 librempeg 等媒体工具时覆盖可用资产。
      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-swipe-windows
          path: |
            dist/*.exe
            dist/latest.yml
