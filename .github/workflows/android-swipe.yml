name: android-swipe

# 手机个人版（独立包名 io.github.hongguo.personal2）：
# 基于共享 React + 滑动推荐构建 APK，并用固定签名密钥保证后续覆盖升级。
on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 直接使用 runner 预装的 Android SDK，避免 setup-android 尝试安装已下线的 'tools' 包。
      - name: Install Android SDK 36 / build-tools 36.0.0
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install android dependencies
        run: npm --prefix android ci --ignore-scripts --no-audit --no-fund

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "缺少 ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          mkdir -p android/.private
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/.private/install.p12
          printf '%s' "$ANDROID_KEYSTORE_PASSWORD" > android/.private/password
          chmod 600 android/.private/install.p12 android/.private/password

      - name: Build standalone APK
        run: python3 android/build.py --standalone

      - name: Verify APK metadata
        run: |
          cat android/build/verification.json
          test -s android/build/hongguo-personal2-*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-personal2-apk
          path: |
            android/build/hongguo-personal2-*.apk
            android/build/verification.json

      - name: Publish APK release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/build/hongguo-personal2-*.apk
            android/build/verification.json
